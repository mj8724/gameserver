<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏服务器控制台</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--blue:#58a6ff;--red:#f85149}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1120px;margin:0 auto;padding:32px 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.top h1{font-size:24px;margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}.card h2{font-size:17px;margin:0 0 16px}.status{font-size:24px;font-weight:650}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:1px solid var(--line);border-radius:7px;background:#21262d;color:var(--text);padding:9px 14px;font:inherit;cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:#238636;border-color:#238636}button.danger{color:#ff7b72}button:disabled{opacity:.5;cursor:not-allowed}label{display:block;margin:12px 0 6px;color:var(--muted)}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#0d1117;color:var(--text);font:inherit}input[type=checkbox]{width:auto}form .check{display:flex;align-items:center;gap:8px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.notice{min-height:22px;margin:12px 0;color:var(--muted)}#logs{height:330px;overflow:auto;background:#0d1117;border:1px solid var(--line);border-radius:7px;padding:12px;font:13px ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}.console{display:flex;gap:8px;margin-top:10px}.console input{flex:1}.hidden{display:none!important}.wide{grid-column:1/-1}.pill{display:inline-block;padding:4px 9px;background:#21262d;border-radius:999px;color:var(--blue);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.field-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
<header class="top"><div><h1>游戏服务器控制台</h1><div class="muted">Project Zomboid · 单机实例管理</div></div><button id="logout" class="hidden">退出登录</button></header>
<section id="login-card" class="card hidden" style="max-width:430px;margin:12vh auto"><h2>管理员登录</h2><form id="login-form"><label for="login-password">管理员口令</label><input id="login-password" type="password" autocomplete="current-password" required><div class="row"><button class="primary">登录</button></div></form><div id="login-message" class="notice"></div></section>
<article class="card"><h2>服务端版本</h2><div class="row"><select id="version-select"></select><button id="install-version" class="primary">下载所选版本</button></div><div class="progress"><div id="install-bar" class="progress-bar"></div></div><div id="install-progress" class="muted">—</div></article>
<article class="card"><h2>服务器配置项</h2><div class="row"><input id="option-search" placeholder="搜索配置项" autocomplete="off"><span id="options-status" class="muted"></span></div><div id="options-groups"></div><div class="row"><button id="options-save">保存配置项</button></div><div id="options-message" class="notice"></div></article>

<section id="dashboard" class="grid hidden">
<article class="card"><h2>服务器状态</h2><div id="server-status" class="status">读取中</div><div id="server-meta" class="muted">—</div><div class="row"><button id="install" class="primary">安装 / 更新</button><button id="start">启动</button><button id="stop">停止</button><button id="restart">重启</button></div><div id="install-info" class="notice"></div></article>
<article class="card"><h2>运行信息</h2><div>PID：<span id="pid">—</span></div><div style="margin-top:10px">CPU：<span id="cpu">—</span></div><div style="margin-top:10px">内存：<span id="memory">—</span></div><div style="margin-top:10px">运行时间：<span id="uptime">—</span></div></article>
<article class="card"><h2>服务器配置</h2><form id="config-form"><div id="config-fields" class="field-grid"></div><div class="row"><button class="primary">保存配置</button></div></form><div id="config-message" class="notice"></div></article>
<article class="card"><h2>端口</h2><form id="ports-form"><div class="field-grid"><div><label for="port-server">主通信端口 (UDP)</label><input id="port-server" type="number" min="1" max="65535"></div><div><label for="port-direct">直连数据端口 (UDP)</label><input id="port-direct" type="number" min="1" max="65535"></div></div><div class="row"><button class="primary">保存端口</button></div></form><div id="ports-message" class="notice"></div></article>
<article class="card wide"><h2>控制台日志</h2><div id="logs" aria-live="polite"></div><form id="command-form" class="console"><input id="command" placeholder="输入服务器控制台指令" autocomplete="off"><button>发送</button></form></article>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let socket=null;let fields=[];
async function api(path,options={}){const response=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.detail||`请求失败 (${response.status})`);return data}
function showLogin(message=''){ $('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login-card').classList.remove('hidden');$('login-message').textContent=message }
function showDashboard(){ $('login-card').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');loadAll();connectConsole() }
async function checkAuth(){try{const data=await api('/api/auth/status');data.authenticated?showDashboard():showLogin()}catch(error){showLogin(error.message)}}
$('login-form').addEventListener('submit',async event=>{event.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({password:$('login-password').value})});$('login-password').value='';showDashboard()}catch(error){$('login-message').textContent=error.message}});
$('logout').addEventListener('click',async()=>{if(socket)socket.close();await api('/api/auth/logout',{method:'POST'});showLogin()});
function duration(seconds){seconds=Math.max(0,Number(seconds)||0);const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=Math.floor(seconds%60);return `${h}小时 ${m}分 ${s}秒`}
async function loadStatus(){const data=await api('/api/status');$('server-status').textContent=data.status;$('server-meta').textContent=`${data.is_installed?'已安装':'未安装'} · ${data.platform} · 端口 ${data.ports.SERVER_PORT}/${data.ports.DIRECT_PORT}`;$('pid').textContent=data.pid??'—';$('cpu').textContent=`${data.cpu_percent}%`;$('memory').textContent=`${data.memory_mb} MB`;$('uptime').textContent=duration(data.uptime_seconds);const task=data.install_task;$('install-info').textContent=task.status==='INSTALLING'?`${task.message} · ${task.progress.toFixed(1)}%`:task.error?`${task.message}：${task.error}`:task.message}
function renderField(field){const id=`field-${field.key}`;const label=document.createElement('label');label.htmlFor=id;label.textContent=field.label;let input;if(field.type==='boolean'){input=document.createElement('input');input.id=id;input.name=field.key;input.type='checkbox';input.checked=Boolean(field.value);const wrap=document.createElement('div');wrap.className='check';wrap.append(input,label);return wrap}input=document.createElement('input');input.id=id;input.name=field.key;input.type=field.type==='password'?'password':field.type==='number'?'number':'text';input.autocomplete='new-password';if(field.type==='password'){input.placeholder='留空表示保持当前口令'}else input.value=field.value??'';if(field.validation?.min!==undefined)input.min=field.validation.min;if(field.validation?.max!==undefined)input.max=field.validation.max;const wrap=document.createElement('div');wrap.append(label,input);return wrap}
async function loadConfig(){const data=await api('/api/server/config');fields=data.fields;$('config-fields').replaceChildren(...fields.map(renderField));$('port-server').value=data.ports.SERVER_PORT;$('port-direct').value=data.ports.DIRECT_PORT}
async function loadLogs(){const data=await api('/api/server/logs?limit=200');$('logs').textContent=data.logs.join('\n');$('logs').scrollTop=$('logs').scrollHeight}
async function loadAll(){try{await Promise.all([loadStatus(),loadConfig(),loadLogs(),loadTemplates(),loadOptions()])}catch(error){if(error.message==='请先登录')showLogin();else console.error(error)}}
function connectConsole(){if(socket)socket.close();const scheme=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${scheme}://${location.host}/ws/console`);socket.onmessage=event=>{const message=JSON.parse(event.data);if(message.type==='log'){$('logs').textContent+=`${$('logs').textContent?'\n':''}${message.data}`;$('logs').scrollTop=$('logs').scrollHeight}};socket.onclose=()=>{if(!$('dashboard').classList.contains('hidden'))setTimeout(connectConsole,2500)}}
async function action(path,label){try{const data=await api(path,{method:'POST',body:'{}'});$('install-info').textContent=data.message||label;await loadStatus()}catch(error){$('install-info').textContent=error.message}}
$('install').onclick=()=>action('/api/server/install','安装已启动');$('start').onclick=()=>action('/api/server/start','已启动');$('stop').onclick=()=>action('/api/server/stop','已停止');$('restart').onclick=()=>action('/api/server/restart','已重启');
$('config-form').addEventListener('submit',async event=>{event.preventDefault();const variables={};for(const field of fields){const input=$(`field-${field.key}`);if(field.type==='boolean')variables[field.key]=input.checked;else if(field.type==='password'){if(input.value)variables[field.key]=input.value}else if(field.type==='number')variables[field.key]=Number(input.value);else variables[field.key]=input.value}try{await api('/api/server/config',{method:'POST',body:JSON.stringify({variables})});$('config-message').textContent='配置已保存';await loadConfig()}catch(error){$('config-message').textContent=error.message}});
$('ports-form').addEventListener('submit',async event=>{event.preventDefault();try{await api('/api/server/config',{method:'POST',body:JSON.stringify({ports:{SERVER_PORT:Number($('port-server').value),DIRECT_PORT:Number($('port-direct').value)}})});$('ports-message').textContent='端口已保存'}catch(error){$('ports-message').textContent=error.message}});

async function loadTemplates(){try{const data=await api('/api/templates');const list=Array.isArray(data)?data:(data.templates||[]);const template=list[0];const select=$('version-select');if(!template||!select)return;const versions=template.versions||[];select.replaceChildren(...versions.map(version=>{const option=document.createElement('option');option.value=version.branch;option.textContent=`${version.label}${version.default?'（默认）':''}`+(version.build_id?` · build ${version.build_id}`:'');option.selected=Boolean(version.default);return option}))}catch(error){if(error.message==='请先登录')showLogin()}}
let optionEntries=[],optionGroups=[];
function renderOptionControl(option){const id=`option-${option.key}`;const wrap=document.createElement('div');wrap.className='field';const label=document.createElement('label');label.htmlFor=id;label.textContent=option.label;let input;if(option.type==='bool'){input=document.createElement('input');input.type='checkbox';input.id=id;input.checked=Boolean(option.value);if(option.writable!=='rw')input.disabled=true} else if(option.type==='enum'){input=document.createElement('select');input.id=id;for(const value of option.enum||[]){const item=document.createElement('option');item.value=value;item.textContent=value;item.selected=String(option.value)===String(value);input.append(item)}if(option.writable!=='rw')input.disabled=true} else {input=document.createElement('input');input.id=id;input.type=option.type==='int'||option.type==='float'?'number':'text';if(option.type==='float')input.step='any';if(option.secret)input.placeholder='留空表示保持当前值';else input.value=option.value??'';if(option.min!==undefined&&option.min!==null)input.min=option.min;if(option.max!==undefined&&option.max!==null)input.max=option.max;if(option.writable!=='rw')input.disabled=true}const hint=document.createElement('span');hint.className='muted';hint.textContent=[option.group,option.requires_restart?'重启后生效':'',option.writable!=='rw'?'由其他页面管理':''].filter(Boolean).join(' · ');wrap.append(label,input,hint);if(option.description){const note=document.createElement('span');note.className='muted';note.textContent=option.description;wrap.append(note)}return wrap}
function renderOptions(){const container=$('options-groups');if(!container)return;const needle=$('option-search')?$('option-search').value.trim().toLowerCase():'';const byGroup=new Map();for(const option of optionEntries){if(needle&&!option.key.toLowerCase().includes(needle))continue;const group=option.group||'其他';if(!byGroup.has(group))byGroup.set(group,[]);byGroup.get(group).push(option)}const groups=[...byGroup.entries()].sort((a,b)=>a[0].localeCompare(b[0]));container.replaceChildren(...groups.map(([group,items])=>{const details=document.createElement('details');details.open=Boolean(needle);const summary=document.createElement('summary');summary.textContent=`${group}（${items.length}）`;details.append(summary);for(const option of items)details.append(renderOptionControl(option));return details}));$('options-status').textContent=`共 ${optionEntries.length} 项，显示 ${groups.reduce((total,entry)=>total+entry[1].length,0)} 项`}
async function loadOptions(){try{const data=await api('/api/server/config');optionEntries=data.options||[];optionGroups=data.groups||[];renderOptions();if(data.catalog_degraded)$('options-message').textContent='配置目录不可用，选项为只读展示'}catch(error){if(error.message==='请先登录')showLogin()}}
async function saveOptions(){const values={};for(const option of optionEntries){const input=$(`option-${option.key}`);if(!input||input.disabled)continue;if(option.type==='bool'){values[option.key]=input.checked?'true':'false'}else if(option.secret){if(input.value)values[option.key]=input.value}else{values[option.key]=String(input.value)}}if(!Object.keys(values).length){$('options-message').textContent='没有需要保存的改动';return}try{await api('/api/server/config',{method:'POST',body:JSON.stringify({options:values})});$('options-message').textContent='已写入配置文件';await loadOptions();await loadStatus();const status=await api('/api/status');if(status.pending_restart)$('options-message').textContent='已写入配置文件，重启后生效'}catch(error){$('options-message').textContent=error.message}}
async function installVersion(){try{const branch=$('version-select')?$('version-select').value:'';const data=await api('/api/server/install',{method:'POST',body:JSON.stringify({version:branch})});$('options-message').textContent=data.message||'安装任务已启动';await loadStatus()}catch(error){$('options-message').textContent=error.message}}
function refreshProgress(){try{api('/api/status').then(status=>{const task=status.install_task||{};const bar=$('install-bar');if(bar)bar.style.width=`${Math.max(0,Math.min(100,task.progress||0))}%`;const text=$('install-progress');if(text)text.textContent=`${task.status} · ${(task.progress||0).toFixed(1)}% · ${task.message||''}${task.version?` · ${task.version}`:''}`})}catch(error){}}
$('command-form').addEventListener('submit',async event=>{event.preventDefault();const input=$('command');if(!input.value.trim())return;try{await api('/api/server/command',{method:'POST',body:JSON.stringify({command:input.value})});input.value=''}catch(error){$('install-info').textContent=error.message}});
setInterval(()=>{if(!$('dashboard').classList.contains('hidden'))loadStatus().catch(()=>{})},2500);checkAuth();
</script>
</body>
</html>
