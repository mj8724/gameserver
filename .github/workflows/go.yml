name: go

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal tools)"
          if [ -n "$out" ]; then
            echo "gofmt reported unformatted files:"
            echo "$out"
            exit 1
          fi
          echo "gofmt clean"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build
        run: go build ./...
      - name: architecture boundaries
        run: go test ./internal/archtest/...
# gofmt 只扫描本模块自己的目录（cmd internal）；research_repos/ 是下游参考仓库（各自为模块且被 .gitignore 排除），不属于本模块质量口径。
